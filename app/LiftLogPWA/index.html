<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiftLog" />
    <title>LiftLog</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="brand-bar">
        <div class="logo">L</div>
        <div>
          <strong>LiftLog</strong>
          <span id="profile-label">Aluno</span>
        </div>
        <button id="profile-toggle" type="button">Trocar perfil</button>
      </header>

      <main id="screen" class="screen" aria-live="polite"></main>

      <nav id="tabs" class="tabs" aria-label="Navegacao do aplicativo"></nav>
    </div>

    <div id="install-banner" class="install-banner" hidden>
      <div>
        <strong>Instalar LiftLog</strong>
        <span>Adicione na tela inicial para usar como app.</span>
      </div>
      <button id="install-button" type="button">Instalar</button>
      <button id="install-close" type="button" aria-label="Fechar aviso">×</button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
